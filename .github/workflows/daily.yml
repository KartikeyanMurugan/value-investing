name: Daily valuation

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 7:00 PM IST, Mon–Fri (after market close)
  workflow_dispatch:
    inputs:
      full:
        description: "Fetch fundamentals for ALL stocks (first run, ~1–2 hours)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fundamentals cache lives in GitHub's Actions cache (free, 10 GB) instead of the repo,
      # so the repo never grows. If the cache is ever evicted, fetch.py does a full refresh.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Fetch data and build stocks.json
        run: python pipeline/fetch.py ${{ inputs.full && '--full' || '' }}

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
