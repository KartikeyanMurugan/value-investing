name: Daily valuation

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 7:00 PM IST, Mon–Fri (after market close)
  workflow_dispatch:
    inputs:
      full:
        description: "Fetch fundamentals for ALL stocks (first run, ~1–2 hours)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data and build stocks.json
        run: python pipeline/fetch.py ${{ inputs.full && '--full' || '' }}

      - name: Save data to the repo
        run: |
          git config user.name "value-bot"
          git config user.email "value-bot@users.noreply.github.com"
          git add data site/data
          git commit -m "data: $(date -u +%F)" || echo "no changes"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
